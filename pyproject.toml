[project]
name = "photoroom"
version = "0.1.0"
description = "Clean up Google Photos from a Takeout export: duplicates, similar shots, screenshots, chat images, blurry / dark photos, big videos."
readme = "README.md"
authors = [
    { name = "mostodont01", email = "otoskypala0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pyside6>=6.12.0",
]

[project.scripts]
photoroom = "photoroom:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
